org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Machine has ~8 GB RAM: give the Kotlin daemon its own small heap (it otherwise inherits org.gradle.jvmargs)
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental cache breaks when the pub cache (C:) and project (D:) are on different drives
kotlin.incremental=false
